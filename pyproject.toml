[project]
name = "separation"
version = "1.0.0"
description = "Use a model of Coudert with RC2 to solve pathwidth."
authors = [
    {name = "Victor Miller",email = "victorsmiller@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-sat (>=1.8.dev16,<2.0)",
    "networkx>=3.6.1",
]

[tool.poetry]
packages = [{include = "separation", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
